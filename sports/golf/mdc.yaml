# Instante sub-cuadro del impacto (CONTRATO.md §subframe). NO es una métrica del
# registro: es un campo del evento. La verdad es el mismo cruce geométrico calculado
# a 2400 fps (tiempo continuo). Nadie lo lee todavía: para que viaje a
# analysis.json hay que leerlo desde sports/<deporte>/events.py (ver el informe del 13).
events:
  impact:
    subframe:
      unit: ms
      views: [face_on]
      fps_min: 30.0
      bias_ms: -0.1265
      mdc_ms: 2.9269
      mdc_frames_by_fps:
        "240": 0.6791
        "120": 0.3512
        "60": 0.1745
        "30": 0.0592
      truth_s: {face_on: 2.359769, down_the_line: 2.358737}

