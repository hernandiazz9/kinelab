[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinelab"
version = "0.0.1"
description = "Motor de medición del movimiento humano a partir de video de celular. Agnóstico al deporte."
requires-python = ">=3.12"
# Fase 0: sólo lo que hace falta para verificar la captura. numpy, rtmlib,
# onnxruntime y OpenCV entran en la Fase 1, cuando haya clips reales que
# pasen el gate (ver ESPECIFICACION.md).
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Fase 1 (ADR-015). rtmlib exige a la vez opencv-python y opencv-contrib-python
    # (los dos instalan el mismo paquete `cv2`): se fijan a la MISMA versión para
    # que el binario sea uno solo (HERENCIA.md §Gotchas: dos OpenCV a la vez).
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python==4.14.0.94",
    "opencv-contrib-python==4.14.0.94",
    "onnxruntime>=1.23",
    "rtmlib==0.0.16",
]

[project.optional-dependencies]
# httpx no está en ADR-015: lo exige el TestClient de FastAPI y sólo se usa en
# tests. Si se decide no tenerlo, tests/test_service.py se salta solo.
dev = ["pytest>=8.0", "httpx>=0.27"]
# La página local del gate (service/). FastAPI + uvicorn están en ADR-015.
service = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
kinelab-fps-truth = "kinelab.tools.fps_truth:main"
kinelab-ingest = "kinelab.ingest.__main__:main"

[tool.setuptools.packages.find]
include = ["kinelab*", "sports*", "service*"]

[tool.setuptools.package-data]
service = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sin `addopts = "-q"`: sumado al `-q` que todos los comandos del proyecto pasan
# en la línea de órdenes da `-qq`, que NO imprime el conteo de pasados y
# fallados. Los tests se leen por exit code y conteo, así que la línea de
# resumen no es decorativa (auditoría del 16/9, §7).
pythonpath = ["."]  # tests/helpers importable como tests.helpers
